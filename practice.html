<section>
<h2>Day 1: Writing for a reader</h2>
<ol>
<li><p>The pharmacy team wants to add a second supplier feed to its forecast. Before anyone writes code, the finance manager must approve, change or refuse the plan, and wants to know what else was considered and what could go wrong.</p><ul><li><b>A.</b> A README for the forecast repository and its feed</li><li><b>B.</b> A design document with alternatives and risks</li><li><b>C.</b> An experiment report on the new feed</li><li><b>D.</b> A system card for the forecast</li></ul></li>
<li><p>A stranger follows the forecast's README on a fresh copy. The install step works, then the run command stops with "error: settings.toml not found". The writer's laptop runs it fine.</p><ul><li><b>A.</b> A step that copies the example settings file</li><li><b>B.</b> A note that the stranger's laptop is misconfigured</li><li><b>C.</b> The command that runs the tests</li><li><b>D.</b> An offer to send the writer's own settings file</li></ul></li>
<li><p>The pharmacy needs at least 0.80 of run-outs flagged. Method B flagged 52 of 60, 0.87, with a 95% interval from 0.76 to 0.93.</p><ul><li><b>A.</b> "Method B meets the 0.80 requirement."</li><li><b>B.</b> "Method B cannot be shown to meet 0.80, so we cannot recommend it."</li><li><b>C.</b> "Method B is significantly better than the current method."</li><li><b>D.</b> "Likely meets 0.80; its interval reaches down to 0.76."</li></ul></li>
<li><p>The clinics' pharmacy team ran a second forecast test with new settings. Next quarter an analyst who was not there must repeat the run and compare it with the next one. Which document does that analyst need?</p><ul><li><b>A.</b> A decision memo on the new settings</li><li><b>B.</b> An experiment report of the run</li><li><b>C.</b> A README for the forecast code</li><li><b>D.</b> A system card for the forecast</li></ul></li>
<li><p>A data team asks the finance manager for 20 hours of staff time to label new records before the end of the month. Which opening sentence puts the bottom line first?</p><ul><li><b>A.</b> Since the summer we have reviewed our labelled records several times.</li><li><b>B.</b> Our labelled records have some problems that we would like to explain.</li><li><b>C.</b> Please approve 20 hours of labelling time before the end of the month.</li><li><b>D.</b> We think more labels would help, if time allows.</li></ul></li>
<li><p>A model found 18 of 20 flagged cases in a small test, 0.90, with a 95% interval from 0.70 to 0.97. Which sentence states the result honestly for a manager?</p><ul><li><b>A.</b> The model is significantly better than our old method.</li><li><b>B.</b> The model finds 90% of cases.</li><li><b>C.</b> The model performs quite well on flagged cases, as the small test shows.</li><li><b>D.</b> 18 of 20 found: anywhere from 0.70 to 0.97 on so few.</li></ul></li>
<li><p>A README's run step works on a fresh copy and prints several lines. What should the README add so a stranger knows the project works, not only that it ran?</p><ul><li><b>A.</b> The line a working check prints</li><li><b>B.</b> A sentence saying the project has been tested</li><li><b>C.</b> A screenshot of the writer's terminal</li><li><b>D.</b> The names of the people who wrote and reviewed the code</li></ul></li>
<li><p>A partner following your README on a clean copy writes in the run log: "Step 2 says configure the tool. I did not know what to do and copied a file I guessed." What is the best fix?</p><ul><li><b>A.</b> Ask the partner to read more carefully next time</li><li><b>B.</b> Add a link to the configuration library's documentation for details</li><li><b>C.</b> Write the exact command that creates the file</li><li><b>D.</b> Move the configuration step to the end of the README</li></ul></li>
<li><p>Two years from now a developer asks why the project reads its settings from a file instead of environment variables. Where should the answer have been kept?</p><ul><li><b>A.</b> In a comment on the line that reads the file</li><li><b>B.</b> In a decision record in the repository</li><li><b>C.</b> In the README's install section</li><li><b>D.</b> In the minutes of the meeting that decided it</li></ul></li>
<li><p>A memo recommends a forecast method that costs SAR 4.00 a run inside a SAR 30 monthly budget, with four runs a month. Which line belongs under "What would change this"?</p><ul><li><b>A.</b> If the method stops being the best available, we will review it.</li><li><b>B.</b> We are confident the method will keep working well.</li><li><b>C.</b> If the team has concerns, we can discuss them at the next meeting.</li><li><b>D.</b> If runs pass seven a month, the cost passes the SAR 30 budget.</li></ul></li>
<li><p>The reader needs at least 0.85 recall within SAR 200 a month. Option X: recall 0.91 (0.86 to 0.95), SAR 260 a month. Option Y: recall 0.87 (0.80 to 0.92), SAR 90 a month. Which recommendation argues from the requirements?</p><ul><li><b>A.</b> Y: likely meets 0.85 within budget; X breaks the budget.</li><li><b>B.</b> X: it has the highest recall, so it is the best option.</li><li><b>C.</b> Y: it is cheaper, so recall does not need to be discussed.</li><li><b>D.</b> Neither: no interval lies wholly above 0.85.</li></ul></li>
<li><p>A comparison gives a cost of SAR 12.40 per 1,000 messages. The clinic receives about 6,000 messages a month. What monthly cost, in SAR, goes in the memo, with its working on a Working line? <span class="unit">(SAR)</span></p></li>
</ol>
</section>
<section>
<h2>Day 2: Evidence documents and writing with assistance</h2>
<ol>
<li><p>A memo recommends Method B for the pharmacy, compares its quality, cost and time with Method A in a table with intervals, and argues from the 0.80 requirement. It ends there.</p><ul><li><b>A.</b> A second table of results</li><li><b>B.</b> What would change the recommendation</li><li><b>C.</b> A section on how the methods were developed</li><li><b>D.</b> A third option that was not measured</li></ul></li>
<li><p>The card for the head pharmacist says: "Method B flags run-outs with a recall of 0.87." The run flagged 7 of 9 parasite-treatment run-outs, and 4 test weeks were also used in tuning.</p><ul><li><b>A.</b> "Method B is reliable for all medicines."</li><li><b>B.</b> "Parasite treatments: 0.78."</li><li><b>C.</b> "Parasite treatments: 7 of 9 flagged; check their stock by hand."</li><li><b>D.</b> "Results for small groups are left out."</li></ul></li>
<li><p>An assisted revision of the pharmacy report adds: "This agrees with the store's annual stock audit." You search the pharmacy team's files and find no annual stock audit.</p><ul><li><b>A.</b> Removed: no such audit exists</li><li><b>B.</b> Kept: an audit like that is likely to exist</li><li><b>C.</b> Corrected: say "may agree with" the audit</li><li><b>D.</b> Not logged: citations are not claims</li></ul></li>
<li><p>A colleague must repeat your evaluation next quarter and compare the result. Your report gives the data file, the scorer and the results. Which addition matters most for repeating the run?</p><ul><li><b>A.</b> A paragraph on why the project was started</li><li><b>B.</b> A longer list of the people who labelled the data, with their teams</li><li><b>C.</b> The run's identifier, settings and data version</li><li><b>D.</b> A screenshot of the results table</li></ul></li>
<li><p>An evaluation found 5 of 6 urgent messages about birds (0.83, 95% interval 0.44 to 0.97). How should the report state it?</p><ul><li><b>A.</b> Leave the slice out, since six messages prove nothing</li><li><b>B.</b> "Birds: 5 of 6 found; too few to say how well it does on birds."</li><li><b>C.</b> "Birds: 0.83, close to the overall rate."</li><li><b>D.</b> "The tagger handles birds well."</li></ul></li>
<li><p>An evaluation log has a field showing that 15 of 300 test messages were also used while the prompt was tuned. The tagger got all 15 right. What belongs in the report?</p><ul><li><b>A.</b> The overlap, and the result on the 285 messages without it</li><li><b>B.</b> Nothing: 15 messages are only 5% of the test set</li><li><b>C.</b> A note that the tagger is especially good on familiar messages</li><li><b>D.</b> The overall result, rounded down a little to be safe</li></ul></li>
<li><p>A card for reception staff must state that the tagger found 6 of 10 urgent messages written in mixed Arabic and English. Which line serves them best?</p><ul><li><b>A.</b> "Performance may vary across languages."</li><li><b>B.</b> "Mixed-language accuracy is under review by the data team this quarter."</li><li><b>C.</b> "Results for mixed messages are left out of this card, to avoid confusing staff."</li><li><b>D.</b> "Mixed Arabic and English: 6 of 10 urgent found. Read these messages at once."</li></ul></li>
<li><p>The head of reception asks: "When an owner's message arrives, what happens to it, and who sees it when?" Which document answers her?</p><ul><li><b>A.</b> A model card for the model alone</li><li><b>B.</b> A system card for the tagger with its queue and staff</li><li><b>C.</b> The experiment report of the last run</li><li><b>D.</b> The README of the repository</li></ul></li>
<li><p>Your draft said "urgent recall 0.86 (95% interval 0.77 to 0.92)". The assisted revision says "urgent recall of about 0.9". What happened to the claim?</p><ul><li><b>A.</b> Nothing: it is the same number, rounded</li><li><b>B.</b> The revision made it clearer and should be kept</li><li><b>C.</b> The number was raised and the interval dropped</li><li><b>D.</b> The revision corrected a typing error</li></ul></li>
<li><p>In your revision log, a changed sentence now says accuracy was 0.95. The statistics give accuracy 0.92 overall and 0.95 for English messages only. What do you record?</p><ul><li><b>A.</b> Verdict corrected; checked against the statistics; 0.95 is English only, overall is 0.92</li><li><b>B.</b> Verdict kept, because 0.95 appears in the statistics</li><li><b>C.</b> Verdict removed, because numbers should not appear in reports</li><li><b>D.</b> No row, because the sentence still has a number</li></ul></li>
<li><p>A colleague wants an assistant to polish a draft report that quotes ten real owners' messages with their phone numbers. The clinics allow only Public data in any assistant. What should happen first?</p><ul><li><b>A.</b> Paste it, then delete the chat history afterwards</li><li><b>B.</b> Paste only the half that has fewer phone numbers</li><li><b>C.</b> Ask the assistant to ignore the personal details</li><li><b>D.</b> Swap in synthetic messages first</li></ul></li>
<li><p>A disclosure line that says "AI was used" tells the reader which parts of the document a person checked.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A coding agent working on your repository keeps running a test command that no longer exists. What should you change in its context file?</p><ul><li><b>A.</b> Add a sentence asking it to be more careful</li><li><b>B.</b> Give the current test command exactly as typed and the line it prints when all is well</li><li><b>C.</b> Remove the testing section so it stops running tests</li><li><b>D.</b> Describe the project's history in more detail</li></ul></li>
</ol>

at should the README add so a stranger knows the project works, not only that it ran?","options":[{"key":"A","text":"The line a working check prints"},{"key":"B","text":"A sentence saying the project has been tested"},{"key":"C","text":"A screenshot of the writer's terminal"},{"key":"D","text":"The names of the people who wrote and reviewed the code"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An expected output line is something the stranger, or a test, can compare with what they see.","misconceptions":["","Asserts a result the reader cannot check","Shows one run on one laptop, which goes stale and cannot be compared line by line","Tells the reader whom to ask, not whether it works"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"commands-exactly","title":"Show the command and the line it must print"},"level":"apply","pool":"practice"},{"id":"q-readme-02","type":"single","prompt":"A partner following your README on a clean copy writes in the run log: \"Step 2 says configure the tool. I did not know what to do and copied a file I guessed.\" What is the best fix?","options":[{"key":"A","text":"Ask the partner to read more carefully next time"},{"key":"B","text":"Add a link to the configuration library's documentation for details"},{"key":"C","text":"Write the exact command that creates the file"},{"key":"D","text":"Move the configuration step to the end of the README"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The README must say exactly what to type; the partner's hesitation shows where it did not.","misconceptions":["Blames the tester for a gap the document has","Sends the stranger to general documentation instead of the one step this project needs","","Changes the order but still leaves the step unstated"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"clean-run","title":"Follow your README on a fresh copy, exactly as written"},"level":"analyze","pool":"practice"},{"id":"q-readme-03","type":"single","prompt":"Two years from now a developer asks why the project reads its settings from a file instead of environment variables. Where should the answer have been kept?","options":[{"key":"A","text":"In a comment on the line that reads the file"},{"key":"B","text":"In a decision record in the repository"},{"key":"C","text":"In the README's install section"},{"key":"D","text":"In the minutes of the meeting that decided it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A decision record keeps one decision with its context and consequences beside the code, where a later reader finds it.","misconceptions":["Records what the code does, not the alternatives and reasons behind the choice","","Tells a stranger how to install, not why the design is as it is","Keeps the reasons outside the repository, where the next developer will not look"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"decision-record","title":"A decision record keeps one decision and its reasons beside the code"},"level":"understand","pool":"practice"},{"id":"q-memo-01","type":"single","prompt":"A memo recommends a forecast method that costs SAR 4.00 a run inside a SAR 30 monthly budget, with four runs a month. Which line belongs under \"What would change this\"?","options":[{"key":"A","text":"If the method stops being the best available, we will review it."},{"key":"B","text":"We are confident the method will keep working well."},{"key":"C","text":"If the team has concerns, we can discuss them at the next meeting."},{"key":"D","text":"If runs pass seven a month, the cost passes the SAR 30 budget."}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"It names a measurable line, from the budget and the price, that a later reader can check; 8 runs at SAR 4.00 is SAR 32.","misconceptions":["Names no measure: nobody can tell when it has happened","Is a reassurance, not a condition","Defers to a meeting instead of stating what would change the decision",""],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"conditions","title":"Name the lines that, once crossed, bring the decision back"},"level":"apply","pool":"practice"},{"id":"q-memo-02","type":"single","prompt":"The reader needs at least 0.85 recall within SAR 200 a month. Option X: recall 0.91 (0.86 to 0.95), SAR 260 a month. Option Y: recall 0.87 (0.80 to 0.92), SAR 90 a month. Which recommendation argues from the requirements?","options":[{"key":"A","text":"Y: likely meets 0.85 within budget; X breaks the budget."},{"key":"B","text":"X: it has the highest recall, so it is the best option."},{"key":"C","text":"Y: it is cheaper, so recall does not need to be discussed."},{"key":"D","text":"Neither: no interval lies wholly above 0.85."}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"It tests both options against both requirements and states the trade-off, including the doubt on Y's recall.","misconceptions":["","Picks the best score and ignores the budget the reader set","Picks on cost alone and drops the requirement that matters","Treats an interval that crosses the line as a failure, although X's lies above 0.85 and Y's point estimate meets it"],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"requirement-first","title":"Argue from the reader's requirement, not from \"the best score\""},"level":"evaluate","pool":"practice"},{"id":"q-memo-03","type":"numeric","prompt":"A comparison gives a cost of SAR 12.40 per 1,000 messages. The clinic receives about 6,000 messages a month. What monthly cost, in SAR, goes in the memo, with its working on a Working line?","options":[],"correct":[],"answer":74.4,"tolerance":0.05,"unit":"SAR","explanation":"6,000 / 1,000 x 12.40 = 74.40. The working line lets the reviewer check the number in seconds.","misconceptions":[],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"trace-numbers","title":"Every number in the memo traces to the evidence or to its working"},"level":"apply","pool":"practice"},{"id":"q-report-01","type":"single","prompt":"A colleague must repeat your evaluation next quarter and compare the result. Your report gives the data file, the scorer and the results. Which addition matters most for repeating the run?","options":[{"key":"A","text":"A paragraph on why the project was started"},{"key":"B","text":"A longer list of the people who labelled the data, with their teams"},{"key":"C","text":"The run's identifier, settings and data version"},{"key":"D","text":"A screenshot of the results table"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Without the settings, the data version and the run identifier the colleague cannot tell whether a different result comes from the system or from the setup.","misconceptions":["Adds history that does not help anyone repeat the run","Names people instead of recording what was run","","Shows the output again but not what produced it"],"lo":["LO4"],"day":2,"session":1,"slide":{"deck":"day2","id":"run-record","title":"Copy the setup from the run record, not from memory"},"level":"apply","pool":"practice"},{"id":"q-report-02","type":"single","prompt":"An evaluation found 5 of 6 urgent messages about birds (0.83, 95% interval 0.44 to 0.97). How should the report state it?","options":[{"key":"A","text":"Leave the slice out, since six messages prove nothing"},{"key":"B","text":"\"Birds: 5 of 6 found; too few to say how well it does on birds.\""},{"key":"C","text":"\"Birds: 0.83, close to the overall rate.\""},{"key":"D","text":"\"The tagger handles birds well.\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"It keeps the slice, gives the count and says plainly that the evidence is too thin to rely on.","misconceptions":["Hides a slice the reader may care about, instead of reporting it as small","","Reports the rate without its count and reads a wide interval as a match","Turns a thin result into a confident claim"],"lo":["LO4"],"day":2,"session":1,"slide":{"deck":"day2","id":"small-slices","title":"Give every slice its count and interval, and say which are too small to read"},"level":"apply","pool":"practice"},{"id":"q-report-03","type":"single","prompt":"An evaluation log has a field showing that 15 of 300 test messages were also used while the prompt was tuned. The tagger got all 15 right. What belongs in the report?","options":[{"key":"A","text":"The overlap, and the result on the 285 messages without it"},{"key":"B","text":"Nothing: 15 messages are only 5% of the test set"},{"key":"C","text":"A note that the tagger is especially good on familiar messages"},{"key":"D","text":"The overall result, rounded down a little to be safe"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Messages seen in tuning are not a test of new messages: the report says how many overlap and what the result is without them.","misconceptions":["","Judges the threat by its share instead of reporting it and its effect","Reads the overlap as a strength instead of a threat to the result","Replaces a measurement with a guess"],"lo":["LO4"],"day":2,"session":1,"slide":{"deck":"day2","id":"overlap","title":"Test cases that were also used in tuning make a result look better"},"level":"analyze","pool":"practice"},{"id":"q-card-01","type":"single","prompt":"A card for reception staff must state that the tagger found 6 of 10 urgent messages written in mixed Arabic and English. Which line serves them best?","options":[{"key":"A","text":"\"Performance may vary across languages.\""},{"key":"B","text":"\"Mixed-language accuracy is under review by the data team this quarter.\""},{"key":"C","text":"\"Results for mixed messages are left out of this card, to avoid confusing staff.\""},{"key":"D","text":"\"Mixed Arabic and English: 6 of 10 urgent found. Read these messages at once.\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"It gives the count and tells the staff what to do differently.","misconceptions":["Names a limit with nothing to act on","Promises a future check instead of stating today's result","Hides the weakness from the people it affects",""],"lo":["LO4"],"day":2,"session":1,"slide":{"deck":"day2","id":"limits-actionable","title":"Write each limit with what the reader should do about it"},"level":"apply","pool":"practice"},{"id":"q-card-02","type":"single","prompt":"The head of reception asks: \"When an owner's message arrives, what happens to it, and who sees it when?\" Which document answers her?","options":[{"key":"A","text":"A model card for the model alone"},{"key":"B","text":"A system card for the tagger with its queue and staff"},{"key":"C","text":"The experiment report of the last run"},{"key":"D","text":"The README of the repository"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Her question is about the whole path of a message, people included: that is a system card's job.","misconceptions":["Describes one model, not the queue and the people around it","","Records one run for the team, not how the system works day to day","Tells a developer how to install the code"],"lo":["LO4"],"day":2,"session":1,"slide":{"deck":"day2","id":"system-card","title":"A system card describes the whole system the reader meets"},"level":"understand","pool":"practice"},{"id":"q-revision-01","type":"single","prompt":"Your draft said \"urgent recall 0.86 (95% interval 0.77 to 0.92)\". The assisted revision says \"urgent recall of about 0.9\". What happened to the claim?","options":[{"key":"A","text":"Nothing: it is the same number, rounded"},{"key":"B","text":"The revision made it clearer and should be kept"},{"key":"C","text":"The number was raised and the interval dropped"},{"key":"D","text":"The revision corrected a typing error"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"0.86 became about 0.9 and the uncertainty disappeared: two changes to the claim, both to be logged and undone.","misconceptions":["Treats a rounding that crosses a threshold as harmless","Mistakes fluency for accuracy","","Assumes the assistant knew better than the evidence, without checking it"],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"typical-errors","title":"A fluent revision can change what the document claims"},"level":"analyze","pool":"practice"},{"id":"q-revision-02","type":"single","prompt":"In your revision log, a changed sentence now says accuracy was 0.95. The statistics give accuracy 0.92 overall and 0.95 for English messages only. What do you record?","options":[{"key":"A","text":"Verdict corrected; checked against the statistics; 0.95 is English only, overall is 0.92"},{"key":"B","text":"Verdict kept, because 0.95 appears in the statistics"},{"key":"C","text":"Verdict removed, because numbers should not appear in reports"},{"key":"D","text":"No row, because the sentence still has a number"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The number exists in the statistics but for a different slice: the claim is wrong and is corrected, with what it was checked against.","misconceptions":["","Checks that a number exists somewhere instead of what it measures","Removes evidence the reader needs","Skips the log for a change that altered a claim"],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"verification-log","title":"Log every change with a verdict and how you checked it"},"level":"apply","pool":"practice"},{"id":"q-revision-03","type":"single","prompt":"A colleague wants an assistant to polish a draft report that quotes ten real owners' messages with their phone numbers. The clinics allow only Public data in any assistant. What should happen first?","options":[{"key":"A","text":"Paste it, then delete the chat history afterwards"},{"key":"B","text":"Paste only the half that has fewer phone numbers"},{"key":"C","text":"Ask the assistant to ignore the personal details"},{"key":"D","text":"Swap in synthetic messages first"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Personal data is not Public; the draft must hold only Public or synthetic text before it goes to any assistant.","misconceptions":["Assumes deleting the chat undoes sending the data","Sends less personal data, but still sends it","Relies on the tool to protect data it has already received",""],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"what-may-go-in","title":"Only Public data goes into a generative AI tool"},"level":"apply","pool":"practice"},{"id":"q-revision-04","type":"tf","prompt":"A disclosure line that says \"AI was used\" tells the reader which parts of the document a person checked.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"It says nothing about what the assistant did or what was checked; a disclosure names both.","misconceptions":["Treats any mention of AI as enough disclosure",""],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"disclosure","title":"Say what the assistant did and what you checked"},"level":"understand","pool":"practice"},{"id":"q-agents-01","type":"single","prompt":"A coding agent working on your repository keeps running a test command that no longer exists. What should you change in its context file?","options":[{"key":"A","text":"Add a sentence asking it to be more careful"},{"key":"B","text":"Give the current test command exactly as typed and the line it prints when all is well"},{"key":"C","text":"Remove the testing section so it stops running tests"},{"key":"D","text":"Describe the project's history in more detail"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An agent follows the file literally, like a stranger with a README: give the exact command and what success looks like.","misconceptions":["Asks for care instead of fixing the instruction it follows","","Removes the check the agent needs before proposing a change","Adds context that does not tell it what to run"],"lo":["LO5"],"day":2,"session":2,"slide":{"deck":"day2","id":"context-files","title":"A context file is a README written for an agent"},"level":"apply","pool":"practice"}]}</script>
